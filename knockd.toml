# Example knock-daemon configuration.
#
# Run a sanity check without root or libpcap:
#   knockd2 --check --config knockd.toml
#
# See the concurrency story without any setup:
#   knockd2 --demo

# Interface to capture on. Omit for the capture layer's default device.
interface = "eth0"

[firewall]
# "command" — run open_command/close_command with %IP% substituted (knockd-style).
# "nftables" — add the source to an allow-set element with a kernel-side timeout
#              (each door needs `nft_set`; `cmd_timeout` becomes the element timeout).
backend = "command"

[matching]
# How an out-of-order hit to one of a door's own ports is treated:
#   "tolerant" (default) — a stray hit never derails an in-flight sequence;
#                          correctness leans on seq_timeout. Robust to noise and
#                          concurrent traffic.
#   "reset"              — knockd parity: a monitored-but-out-of-order hit aborts
#                          the attempt (the classic reset-on-stray behaviour).
mode = "tolerant"

# Number of matcher worker threads. Sources are partitioned by IP across shards
# (each shard owns its own thread), so concurrent clients scale across cores with
# no cross-shard coordination. 1 (default) = single-threaded; 0 = auto-detect.
shards = 1

# Optional per-source rate limit, "<count>/<duration>": a token bucket allowing a
# burst of <count> packets per source IP, refilling at <count> per <duration>.
# Packets over budget are dropped before matching, so a flood from one address
# can't drown out others or burn CPU. Omit for no limit.
# rate_limit = "50/10s"

[stats]
# Serve Prometheus metrics (packets observed/rate-limited, knocks accepted per
# door, in-flight sources) over HTTP at this address. Bind to localhost or a
# trusted management interface. Omit to disable the endpoint.
# listen = "127.0.0.1:9099"

# A door: an ordered port sequence that, completed in time, opens access.
# Steps are "<port>/<tcp|udp>"; a bare number defaults to tcp.
[[door]]
name = "ssh"
sequence = ["7000/tcp", "8000/udp", "9000/tcp"]
seq_timeout = "10s"                # whole sequence must complete within this window
open_command = "nft add element inet filter knock_clients { %IP% }"
close_command = "nft delete element inet filter knock_clients { %IP% }"
cmd_timeout = "30s"                # auto-run close_command this long after opening

# Doors may overlap (share a prefix) and run concurrently across clients;
# the daemon tracks each source IP independently.
[[door]]
name = "https-admin"
sequence = ["7000/tcp", "8500/tcp", "9100/tcp"]
seq_timeout = "10s"
open_command = "nft add element inet filter admin_clients { %IP% }"

# With backend = "nftables", a door names an allow-set instead of commands. The
# source is added as `nft add element inet filter knock_clients { %IP% timeout 30s }`
# and the kernel expires it — no close_command, no userspace timer. The set must
# exist with a timeout flag, e.g.:
#   nft add set inet filter knock_clients '{ type ipv4_addr; flags timeout; }'
#
# [[door]]
# name = "ssh"
# sequence = ["7000/tcp", "8000/udp", "9000/tcp"]
# seq_timeout = "10s"
# nft_set = "inet filter knock_clients"   # "<family> <table> <set>"; family defaults to inet
# cmd_timeout = "30s"                       # kernel-side element timeout
