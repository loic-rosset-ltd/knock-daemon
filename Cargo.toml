[package]
name = "knock-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Port-knocking daemon for Linux — a knockd replacement that survives retries, retransmits and clients behind one NAT address."
license = "MIT OR Apache-2.0"
repository = "https://github.com/loic-rosset-ltd/knock-daemon"
homepage = "https://github.com/loic-rosset-ltd/knock-daemon"
readme = "README.md"
keywords = ["port-knocking", "firewall", "security", "networking", "daemon"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Loic Rosset <web@mesclefs.com>"]

[[bin]]
name = "knockd2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Live packet capture via libpcap. Off by default so the crate builds and
# tests run on machines without libpcap headers; the matcher core is pure.
pcap = { version = "2", optional = true }

# Raw syscalls for the pure-Rust AF_PACKET capture backend (Linux only). The
# afpacket module is itself cfg(target_os = "linux"); libc compiles everywhere.
libc = { version = "0.2", optional = true }

[features]
default = []
# Enable the libpcap-backed live capture path (requires libpcap-dev / libpcap).
capture-pcap = ["dep:pcap"]
# Enable the pure-Rust AF_PACKET capture path (Linux; no libpcap C dependency).
capture-afpacket = ["dep:libc"]

[profile.release]
lto = true
strip = true
panic = "abort"

# --- Packaging ---------------------------------------------------------------
# Release binaries are built with `--features capture-afpacket`: the pure-Rust
# AF_PACKET capture path has no libpcap C dependency, so the artifacts are
# self-contained (and the musl builds are fully static). The nftables and
# command firewall backends are always compiled in.

# .deb via `cargo deb` (https://github.com/kornelski/cargo-deb).
[package.metadata.deb]
maintainer = "Loic Rosset <web@mesclefs.com>"
copyright = "2026, Loic Rosset"
license-file = ["LICENSE-MIT", "0"]
section = "net"
priority = "optional"
extended-description = """\
A port-knocking daemon for Linux — a knockd replacement that keeps a knock \
alive when the unexpected happens. knockd tracks one in-flight attempt per \
source per door and destroys it on any packet that isn't the exact next step, \
including a re-hit of the door's own first port; knock-daemon tracks a set of \
candidate attempts per source and adds to it, so retries, TCP retransmits and \
clients sharing one NAT address each resolve independently. Ships an \
nftables firewall backend, a knockd-compatible command backend, a pure-Rust \
AF_PACKET capture path, and a hardened systemd unit that runs with just \
CAP_NET_RAW + CAP_NET_ADMIN instead of root."""
# `target/release/...` asset paths are rewritten to the per-target release dir
# automatically when cargo-deb is invoked with `--target <triple>`.
assets = [
    ["target/release/knockd2", "usr/bin/", "755"],
    ["knockd.toml", "etc/knock-daemon/knockd.toml", "640"],
    ["README.md", "usr/share/doc/knock-daemon/README.md", "644"],
    ["DESIGN.md", "usr/share/doc/knock-daemon/DESIGN.md", "644"],
    ["packaging/README.md", "usr/share/doc/knock-daemon/PACKAGING.md", "644"],
    ["LICENSE-APACHE", "usr/share/doc/knock-daemon/LICENSE-APACHE", "644"],
]
conf-files = ["/etc/knock-daemon/knockd.toml"]
recommends = "nftables"

maintainer-scripts = "packaging/deb"

[package.metadata.deb.systemd-units]
# Installs packaging/systemd/knockd2.service and wires up the standard
# deb-systemd maintainer scripts — but does NOT enable or start it, so a fresh
# install never fail-loops before the admin has written a real config.
unit-scripts = "packaging/systemd"
unit-name = "knockd2"
enable = false
start = false

# .rpm via `cargo generate-rpm` (https://github.com/cat-in-136/cargo-generate-rpm).
[package.metadata.generate-rpm]
summary = "Port-knocking daemon for Linux — a knockd replacement that survives retries and shared source addresses."
assets = [
    { source = "target/release/knockd2", dest = "/usr/bin/knockd2", mode = "755" },
    { source = "knockd.toml", dest = "/etc/knock-daemon/knockd.toml", mode = "640", config = true },
    { source = "packaging/systemd/knockd2.service", dest = "/usr/lib/systemd/system/knockd2.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/knock-daemon/README.md", mode = "644", doc = true },
    { source = "DESIGN.md", dest = "/usr/share/doc/knock-daemon/DESIGN.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/knock-daemon/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/knock-daemon/LICENSE-APACHE", mode = "644", doc = true },
]
# The unit ships disabled; just refresh systemd's view of it on install/removal.
pre_install_script = """\
getent group knockd2 >/dev/null || groupadd --system knockd2
getent passwd knockd2 >/dev/null || useradd --system -g knockd2 \
    --no-create-home --shell /sbin/nologin knockd2
exit 0"""
post_install_script = """\
if [ -e /etc/knock-daemon/knockd.toml ]; then
    chown root:knockd2 /etc/knock-daemon/knockd.toml
    chmod 0640 /etc/knock-daemon/knockd.toml
fi
systemctl daemon-reload >/dev/null 2>&1 || true
exit 0"""
pre_uninstall_script = """\
if [ "$1" = 0 ]; then
    systemctl --no-reload disable --now knockd2.service >/dev/null 2>&1 || true
fi
exit 0"""
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || true"

[package.metadata.generate-rpm.recommends]
nftables = "*"
