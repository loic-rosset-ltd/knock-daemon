name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap (for the capture-pcap feature)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Format
        run: cargo fmt --all --check
      # Clippy across every feature combo that has a Linux code path. The
      # AF_PACKET backend + cBPF prefilter only *compile* here, never on macOS.
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (capture-afpacket)
        run: cargo clippy --all-targets --features capture-afpacket -- -D warnings
      - name: Clippy (capture-afpacket + capture-pcap)
        run: cargo clippy --all-targets --features "capture-afpacket capture-pcap" -- -D warnings
      - name: Test (default)
        run: cargo test --all-targets
      - name: Test (capture-afpacket)
        run: cargo test --all-targets --features capture-afpacket
      - name: Test (capture-afpacket + capture-pcap)
        run: cargo test --all-targets --features "capture-afpacket capture-pcap"

  macos:
    name: macOS — build, lint, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libpcap ships with the macOS SDK; no install step needed.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (capture-pcap)
        run: cargo clippy --all-targets --features capture-pcap -- -D warnings
      - name: Test (default)
        run: cargo test --all-targets
      - name: Test (capture-pcap)
        run: cargo test --all-targets --features capture-pcap

  integration:
    name: Linux live wire-test — afpacket + cBPF + nftables
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Build release (capture-afpacket)
        run: cargo build --release --features capture-afpacket
      # Runs the daemon for real: opens the AF_PACKET socket, attaches the
      # hand-emitted cBPF prefilter to a live kernel, drives a knock over `lo`,
      # and asserts the door opened via the nftables set and /metrics. This is
      # the one path the unit tests can't reach (needs root + a real kernel).
      - name: Wire-test the live capture → match → nftables pipeline
        run: sudo --preserve-env=PATH ./ci/wire-test.sh
