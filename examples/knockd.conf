# Example *classic knockd* configuration, parsed by knock-daemon's compatibility
# layer. Point the daemon straight at an existing knockd.conf:
#
#   knockd2 --check --config examples/knockd.conf
#
# A `.conf` extension selects this legacy INI format; anything else is parsed as
# knock-daemon's native TOML. knockd's command/start_command/stop_command map
# onto the `command` firewall backend, and `port:proto` steps become `port/proto`.
# Because knockd resets a client's progress on any out-of-order hit, a parsed
# .conf runs in the daemon's "reset" matching mode for behavioural parity.
#
# Note the port sequences below are deliberately NOT in ascending order: an
# ordinary ascending port scan completes an ascending sequence inside
# seq_timeout, in either matching mode. See SECURITY.md.

[options]
	UseSyslog
	Interface = enp3s0

# Open-only door: one command runs on a successful knock.
[openSSH]
	sequence    = 41953,8271,22986
	seq_timeout = 5
	tcpflags    = syn
	command     = /sbin/iptables -A INPUT -s %IP% -p tcp --dport 22 -j ACCEPT

# Open-then-close door: start_command runs on the knock, stop_command runs
# cmd_timeout seconds later. Mixed tcp/udp steps are supported.
[opencloseSSH]
	sequence      = 38121:udp,4409:tcp,19775:udp
	seq_timeout   = 15
	tcpflags      = syn
	start_command = /usr/sbin/iptables -A INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
	cmd_timeout   = 10
	stop_command  = /usr/sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
